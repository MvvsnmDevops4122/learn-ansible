- name: Demo on filters
  hosts: local
  connection: local 
  vars:
    courses: "ansible,docker,kubernetes"  # String variable
    name:
      - Siva
      - Sankar
      - Molleti
  tasks:
    - name: Print person name
      debug:
        msg: "Hello {{ person_name | default('satya') }}"  # Use 'satya' if person_name is not defined
# | - filter
    - name: convert string to list
      debug:
      # split(',') – # Convert string to list using split filter
      # trim – Removes extra spaces from each item using trim filter.
        msg: "Courses I am learning: {{ courses | split(',') | trim }}"  
    - name: convert list to string
      debug:
        msg: "My full name is: {{ name | join(' ') }}"  # Convert list to string using join filter
    
        
        

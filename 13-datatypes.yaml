- name: print the data types 
  hosts: local
  connection: local
  vars:
   course: "AIOPS with DevSecops on AWS" #strin
   duration_in_hours: 150 # integer
   is_course_completed: false # boolean
   topics:
    - Linux
    - Shell Scripting
    - Ansible
   more_details:
    trainer: "satya M"
    months: 4 # integer
   exact_duration_in_months: 4.5 # float
  tasks:
   - name: print the variables 
     debug:
      msg: |
        name: {{ course }} : {{ course | type_debug }}
        duration: {{ duration_in_hours }} : {{ duration_in_hours | type_debug }}
        is completed: {{ is_course_completed }} : {{ is_course_completed | type_debug }}
        topics: {{ topics }} : {{ topics | type_debug }}
        more details: {{ more_details }} : {{ more_details | type_debug }}  
        duration: {{ exact_duration_in_months }} : {{ exact_duration_in_months | type_debug }}


# type_debug is a filter in Ansible that returns the data type of a variable. 

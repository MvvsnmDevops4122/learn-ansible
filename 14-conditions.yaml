- name: even or odd number
  hosts: local
  connection: local

  # vars:
  #   number: 10

  vars_prompt:
    - name: number # Variable to store the number
      prompt: Please enter a number
      private: false # Display the entered number

  tasks:
    - name: is even
      debug:
        msg: "Given number: {{ number }} is even"
      when: number % 2 == 0  # Condition to check if the number is even
    - name: is odd
      debug:
        msg: "Given number: {{ number }} is odd"
      when: number % 2 != 0  # Condition to check if the number is odd
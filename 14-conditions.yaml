# This playbook checks whether the user-provided number is even or odd.
# vars_prompt is used to get input from the user.
# The when keyword is used to execute tasks based on conditions.

---

- name: Check whether a number is even or odd
  hosts: local
  connection: local

  # vars:
  #   number: 10

  vars_prompt:
    - name: number
      prompt: "Please enter a number"
      private: false  # Display the entered number

  tasks:
    - name: Check if the number is even
      debug:
        msg: "Given number: {{ number }} is even"
      when: number % 2 == 0  # Execute if the number is divisible by 2

    - name: Check if the number is odd
      debug:
        msg: "Given number: {{ number }} is odd"
      when: number % 2 != 0  # Execute if the number is not divisible by 2
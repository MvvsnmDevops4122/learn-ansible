# Playbook to demonstrate idempotency in Ansible

- name: Demo on idempotency
  hosts: local
  connection: local
  become: true  # Execute tasks with root privileges

  tasks:
    # Create roboshop user 
    - name: Create user
      user:  # Ansible module to manage Linux users
        name: roboshop  # (equivalent to useradd roboshop)
        state: present  # Create the user if it does not exist.


# present – Create the user if it does not exist.
# absent – Delete the user if it exists.
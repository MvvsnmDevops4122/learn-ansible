---
# Playbook to demonstrate Ansible variable variations

- name: Print greeting
  hosts: local
  connection: local

  # 1. Play-level variable
  # vars:
  #   person_name: "Play-Level Satya"

  # 2. Load variables from an external YAML file
  vars_files:
    - person.yaml
     

  # 3. Prompt the user to enter a variable value
  # vars_prompt:
  #   - name: person_name
  #     prompt: "Please enter your username"
  #     private: false

  tasks:

    # 4. Display the person's name
    - name: Print name of person
      ansible.builtin.debug:
        msg: "Hello {{ person_name }}"

      # 5. Task-level variable
      # vars:
      #   person_name: "Task-Level Satya"
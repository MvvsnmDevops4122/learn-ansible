
- name: Get secrets from AWS Secrets Manager
  hosts: local
  connection: local
  gather_facts: false

  tasks:
    - name: Get the secret from AWS Secrets Manager
      ansible.builtin.debug:

        # Option 1: Retrieve the complete secret
        # lookup() fetches the secret from AWS Secrets Manager.
        # amazon.aws.aws_secret is the AWS Secrets Manager lookup plugin.

        # msg: "{{ lookup('amazon.aws.aws_secret',
        #                 'roboshop/dev/ansible',
        #                 region='us-east-1') }}"

        # Option 2: Convert JSON string into an Ansible dictionary
        # from_json converts JSON data into key-value pairs.

        # msg: "{{ lookup('amazon.aws.aws_secret',
        #                 'roboshop/dev/ansible',
        #                 region='us-east-1') | from_json }}"

        # Option 3: Retrieve only the ansible_user value
        # json_query() extracts the required key from the dictionary.

        msg: "{{ lookup('amazon.aws.aws_secret',
                        'roboshop/dev/ansible',
                        region='us-east-1')
                 | from_json
                 | json_query('ansible_user') }}"

# IMPORTANT CONCEPTS:
# lookup()     -> Fetches data from an external source.
# from_json    -> Converts JSON string into a dictionary.
# json_query() -> Extracts a specific value using a JMESPath expression.
# | (pipe)     -> Passes the output of one filter to the next filter.

# Playbook to demonstrate task-level variables

- name: Demo on task-level variables

  hosts: local                  # Target host
  connection: local             # Execute on Ansible control node

  vars:                         # Play-level variables
    property: "100 acres"       # Available to all tasks in this play

  tasks:
    - name: Print the variables
      ansible.builtin.debug:    # debug also fine
        msg: "Hi, I got {{ property }} from my father"
        # Uses the play-level variable: 100 acres

    - name: Print the variables again
      vars:                     # Task-level variables
        property: "10 acres"    # Overrides the play-level value for this task only
      ansible.builtin.debug:
        msg: "Hi, I got {{ property }} from my father"
        # Uses the task-level variable: 10 acres